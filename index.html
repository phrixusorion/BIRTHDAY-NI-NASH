<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NASH Birthday Digital Memory Wall</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@500;600;700&family=Kalam:wght@400;700&family=Lilita+One&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
   
    <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

    
    <div class="cinematic-lighting-vignette" aria-hidden="true"></div>

    
    <header class="top-floating-banner">
      <div class="banner-badge">
      
        <span class="banner-text">NASH BIRTHDAY MEMORY WALL</span>
       
    
      </div>
    </header>

    <main class="collage-viewport" id="collageViewport">
      <div class="collage-wall-stage" id="collageWallStage">
      </div>
    </main>

/    <div class="card-lightbox-overlay" id="cardLightbox">
      <div class="lightbox-card-container" id="lightboxCardContent">
      </div>
      <button class="lightbox-close-btn" id="closeLightboxBtn" type="button">✕ Close View</button>
    </div>


    <div class="modal-overlay" id="addCardModal">
      <div class="modal-card-box">
        <div class="modal-header">
          <span class="modal-title">Add a Memory Card</span>
          <button class="modal-close-x" id="closeAddModalBtn" type="button">✕</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="inputPhotoUrl">Photo (choose a preset or paste a URL)</label>
            <div class="preset-thumbs-row" id="presetThumbsRow"></div>
            <input class="form-input" id="inputPhotoUrl" type="text" placeholder="images/photo1.jpg" />
          </div>
          <div class="form-group">
            <label class="form-label" for="inputCardMsg">Message</label>
            <textarea class="form-textarea" id="inputCardMsg" rows="3" placeholder="Write your birthday note..."></textarea>
          </div>
          <div class="form-group">
            <label class="form-label" for="inputCardSender">From</label>
            <input class="form-input" id="inputCardSender" type="text" placeholder="Your name" />
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-submit-card" id="submitNewCardBtn" type="button">Add to Wall</button>
        </div>
      </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="app.js"></script>
  </body>
</html>
